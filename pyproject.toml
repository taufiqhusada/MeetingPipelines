[project]
name = "meetpipe"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "slack-bolt>=1.18,<2",
]

[dependency-groups]
after = [
    "anthropic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]
