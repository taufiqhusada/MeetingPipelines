<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meeting Pipelines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.73.3/dist/3d-force-graph.min.js"></script>
<style>
:root{
  --bg:#f6f8fc; --paper-2:#eaf0fa; --panel:rgba(255,255,255,.78); --panel-solid:#ffffff; --line:#dfe5ef; --line-2:#c9d3e4;
  --ink:#141a26; --ink-2:#4a5468; --mute:#8a93a6; --blue:#2f6bff; --cyan:#2f6bff; --blue-soft:#e3ecff; --term:#141821;
  --ok:#1f9d63; --warn:#c98a12; --err:#d9473b;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace; --sans:Inter,-apple-system,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);overflow:hidden}
body::before{content:"";position:fixed;inset:-20%;pointer-events:none;z-index:0;
  background:radial-gradient(42% 40% at 20% 24%,rgba(80,140,255,.30),transparent 70%),
             radial-gradient(40% 36% at 84% 84%,rgba(120,175,255,.22),transparent 70%)}
.caps{font-family:var(--mono);text-transform:uppercase;letter-spacing:.1em;font-size:10.5px;color:var(--mute)}
a{color:inherit}

header{position:relative;z-index:10;display:flex;align-items:center;gap:18px;padding:14px 22px;flex-wrap:wrap}
.brand{font:500 13px var(--mono);letter-spacing:.08em;display:flex;align-items:center;gap:10px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 4px var(--blue-soft)}
.tabs{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;backdrop-filter:blur(8px)}
.tabs button{all:unset;cursor:pointer;font:500 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:7px 15px;border-radius:999px;color:var(--ink-2)}
.tabs button.on{background:var(--ink);color:#fff}
.controls{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.controls select,.controls input{font:13px var(--sans);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 13px;color:var(--ink);outline:none}
.controls input{width:220px}.controls input::placeholder{color:var(--mute)}
.btn{all:unset;cursor:pointer;background:var(--ink);color:#fff;font:500 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:10px 17px;border-radius:999px}
.btn:hover{background:#000}.btn[disabled]{opacity:.4;cursor:default}
.btn.ghost{background:transparent;border:1px solid var(--line-2);color:var(--ink-2)}
.status{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:7px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--ink-2);display:flex;gap:8px;align-items:center}
.status i{width:7px;height:7px;border-radius:50%;background:var(--mute)}
.status.running i{background:var(--blue);animation:blink 1s infinite}.status.done i{background:var(--ok)}.status.error i{background:var(--err)}
@keyframes blink{50%{opacity:.25}}

main{position:relative;z-index:1;height:calc(100% - 66px)}
.view{position:absolute;inset:0;display:none}.view.on{display:block}

#graph{position:absolute;inset:0}
.scene-tooltip:empty{display:none!important}
.scene-tooltip{font:12px var(--sans)!important;background:#fff!important;border:1px solid var(--line-2);border-radius:10px;padding:7px 10px!important;color:var(--ink)!important;max-width:320px;box-shadow:0 10px 30px -18px rgba(20,30,60,.4)}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--ink-2);pointer-events:none;z-index:2}
.empty h2{font:500 24px var(--sans);color:var(--ink);margin:0 0 8px}
.hint{position:absolute;left:22px;bottom:16px;z-index:3;display:flex;gap:16px;align-items:center;font:10.5px var(--mono);color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.hint span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:-1px;background:var(--c)}
#now{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);z-index:3;display:none;align-items:center;gap:10px;
  background:#141821;color:#e6e9f0;font:500 13px var(--mono);padding:9px 16px 9px 12px;border-radius:999px;box-shadow:0 14px 30px -16px rgba(10,20,40,.6);white-space:nowrap}
#now.on{display:flex}#now .ic{width:26px;height:26px;border-radius:50%;background:#262e3f;display:grid;place-items:center}
#now .who{color:#8e96a8;text-transform:uppercase;letter-spacing:.08em;font-size:11px}#now .n{color:#7fa8ff}
#now .spin{width:12px;height:12px;border-radius:50%;border:2px solid #3a4560;border-top-color:#7fa8ff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#floats{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.fl{position:absolute;transform:translate(10px,-50%);background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 11px 4px 5px;
  font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--ink);white-space:nowrap;display:flex;gap:7px;align-items:center;
  box-shadow:0 8px 18px -12px rgba(20,30,60,.5);animation:flin .35s ease-out;transition:opacity .6s}
.fl .ic{width:18px;height:18px;border-radius:50%;background:#141821;display:grid;place-items:center}.fl .ic svg{width:11px;height:11px}
.fl .k{color:var(--mute)}
@keyframes flin{from{opacity:0;transform:translate(0,-50%) scale(.9)}}
.progress{position:absolute;left:50%;top:6px;transform:translateX(-50%);z-index:3;display:flex;gap:6px;align-items:center}
.progress .step{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.progress .step.on{color:#fff;background:var(--blue);border-color:var(--blue)}
.progress .step.done{color:var(--ok);border-color:#bfe3cf}
.progress .sep{width:16px;height:1px;background:var(--line-2)}

#side{position:absolute;top:44px;right:16px;bottom:16px;width:330px;overflow:auto;display:flex;flex-direction:column;gap:10px;z-index:3;padding-right:2px}
#side::-webkit-scrollbar,#drawer::-webkit-scrollbar{width:6px}#side::-webkit-scrollbar-thumb,#drawer::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px}
.term{background:var(--term);border-radius:14px;padding:11px 13px;font:11.5px/1.6 var(--mono);color:#e6e9f0;cursor:pointer;box-shadow:0 14px 30px -18px rgba(10,20,40,.6);transition:transform .15s}
.term:hover{transform:translateY(-1px)}.term.sel{outline:2px solid var(--blue)}
.term .hd{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#8e96a8;border-bottom:1px solid #2a2f3b;padding-bottom:7px;margin-bottom:7px}
.term .hd .av{width:22px;height:22px;font-size:10px}
.term .hd b{color:#fff;font-weight:500}
.term .st{margin-left:auto;font-size:9.5px;padding:2px 8px;border-radius:999px;background:#232836}
.st.running,.st.gathering,.st.summarizing,.st.merging,.st.queued{color:#7fa8ff}.st.complete,.st.done{color:#6fd3a0}.st.failed,.st.timed_out,.st.error{color:#ff8a7e}
.term .ln{flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#b9c0cf}
.term .ln .p{color:#6b7385}.term .ln .n{color:#7fa8ff}
.term .ln.new{animation:in .35s ease-out}
.term .body{max-height:132px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
@keyframes in{from{opacity:0;transform:translateY(4px)}}

#drawer{position:absolute;left:18px;top:44px;width:370px;max-height:calc(100% - 90px);overflow:auto;z-index:4;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:0 24px 50px -28px rgba(20,30,60,.45);display:none}
#drawer.on{display:block;animation:in .2s}
#drawer .x{float:right;cursor:pointer;color:var(--mute);font-size:16px;line-height:1}
#drawer .x:hover{color:var(--ink)}
#drawer h3{margin:6px 0 4px;font:600 17px/1.3 var(--sans)}
#drawer .sub{color:var(--ink-2);font-size:12.5px;margin-bottom:10px}
#drawer .row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px dashed var(--line);font-size:13px}
#drawer .row .ic{width:24px;height:24px;flex:none;border-radius:8px;display:grid;place-items:center;background:var(--term)}
#drawer .row a{text-decoration:none}#drawer .row a:hover{color:var(--blue)}
#drawer .sec{margin-top:12px}
#drawer .tag{font:500 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--paper-2);color:var(--ink-2);white-space:nowrap}
#drawer .tag.cited{background:var(--blue-soft);color:var(--blue)}
#drawer .link{cursor:pointer}#drawer .link:hover{color:var(--blue)}
.icon{width:16px;height:16px;display:block}

#brief,#tasks{height:100%;overflow:auto;padding:6px 22px 40px}
.wrap{max-width:1200px;margin:0 auto}
.goal{background:var(--ink);color:#fff;border-radius:22px;padding:26px 30px;margin:8px 0 20px;position:relative;overflow:hidden}
.goal .caps{color:#9fb0cf}.goal p{font:500 22px/1.35 var(--sans);margin:8px 0 0;max-width:920px}
.goal::after{content:"";position:absolute;right:-70px;top:-70px;width:260px;height:260px;border-radius:50%;background:radial-gradient(var(--blue),transparent 65%);opacity:.55}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.person{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 18px 10px;transition:transform .15s,box-shadow .15s}
.person:hover{transform:translateY(-2px);box-shadow:0 18px 40px -26px rgba(20,30,60,.45)}
.who{display:flex;align-items:center;gap:11px;margin-bottom:6px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:600 12.5px var(--sans);background:var(--blue-soft);color:#1d4fd1;flex:none}
.who b{font-size:16px;font-weight:600}.who .btn{margin-left:auto;padding:6px 11px;font-size:10px}
.bucket{margin:12px 0 2px}.bucket .caps{display:flex;align-items:center;gap:7px}
.bucket .caps::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.bucket ul{margin:6px 0 0;padding:0;list-style:none}
.bucket li{padding:7px 0;border-top:1px dashed var(--line);display:flex;gap:10px;align-items:flex-start}
.chip{font:500 10.5px var(--mono);padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);background:var(--bg);text-decoration:none;white-space:nowrap;margin-left:auto;cursor:pointer;align-self:center}
.chip:hover{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.decide{margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.decide h3,.full h3{margin:0 0 6px;font:600 16px var(--sans)}
.decide label{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px dashed var(--line);cursor:pointer}
.decide input{accent-color:var(--blue);margin-top:4px;width:15px;height:15px}
.decide label.done span{text-decoration:line-through;color:var(--mute)}
.full{margin-top:16px}.full summary{cursor:pointer;font:500 11.5px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2);padding:10px 0}
.full .sec{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin-bottom:12px}
.full ul{padding-left:18px}.full li{margin:7px 0}
.badge{font:500 9.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--paper-2);color:var(--ink-2)}
.badge.done{background:#ddf3e7;color:var(--ok)}.badge.in_progress{background:var(--blue-soft);color:var(--blue)}
.badge.no_evidence,.badge.high{background:#fbe1de;color:var(--err)}.badge.medium{background:#fbf0d9;color:var(--warn)}
#tip{position:fixed;pointer-events:none;z-index:50;background:var(--ink);color:#fff;font:12px var(--sans);padding:7px 10px;border-radius:9px;max-width:320px;display:none}
.note{color:var(--mute);margin:40px auto;text-align:center}

.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 16px}
.filters button{all:unset;cursor:pointer;font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2)}
.filters button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.board{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:14px;align-items:start}
.col{background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:18px;padding:12px;min-height:240px;transition:background .15s}
.col.over{background:var(--blue-soft);border-color:var(--blue)}
.col h4{margin:2px 4px 12px;display:flex;justify-content:space-between;align-items:center}
.col h4 .caps::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:8px;background:var(--c)}
.col h4 .n{font:500 11px var(--mono);color:var(--mute)}
.task{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;cursor:grab;transition:box-shadow .15s,transform .15s}
.task:hover{transform:translateY(-1px);box-shadow:0 12px 26px -20px rgba(20,30,60,.5)}
.task.ro{cursor:default}
.task .t{font-weight:500;margin-bottom:9px}
.task .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.task .av{width:24px;height:24px;font-size:10px}
.flag{font:500 9.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:#fbe1de;color:var(--err)}
.org{font:500 9.5px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin-left:auto}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span>MEETING · PIPELINES</div>
  <nav class="tabs">
    <button data-v="context" class="on">Context graph</button>
    <button data-v="brief">Brief</button>
    <button data-v="tasks">Tasks</button>
  </nav>
  <div class="controls">
    <select id="since"><option value="7d">Last 7 days</option><option value="14d" selected>Last 14 days</option><option value="30d">Last 30 days</option></select>
    <input id="meeting" placeholder="Meeting, e.g. Weekly sync">
    <button class="btn" id="go">▶ Generate prep</button>
    <span class="status" id="status"><i></i><span>idle</span></span>
  </div>
</header>

<main>
  <section class="view on" id="v-context">
    <div id="graph"></div>
    <div class="empty" id="empty"><div><h2>No run yet</h2>Press <b>Generate prep</b> and watch every laptop's context flow into the team brief.</div></div>
    <div class="progress" id="progress"></div>
    <div id="floats"></div>
    <div id="now"></div>
    <div id="drawer"></div>
    <aside id="side"></aside>
    <div class="hint"><span style="--c:#9aa3b5">waiting</span><span style="--c:#2f6bff">fetching</span><span style="--c:#1f9d63">done</span><span style="--c:#d9473b">failed</span>
      <span style="--c:transparent;margin-left:8px">drag to orbit · scroll to zoom · click any node</span></div>
  </section>
  <section class="view" id="v-brief"><div id="brief"><div class="note">The brief appears here when a run finishes.</div></div></section>
  <section class="view" id="v-tasks"><div id="tasks"></div></section>
</main>
<div id="tip"></div>

<script>
/* ======================= icons ======================= */
// 24×24 stroke icons. Colors are app-recognizable accents on the blue theme.
const ICON = {
  claude_code:{c:"#ff9a6b", p:'<path d="M12 2.5v19M2.5 12h19M5.3 5.3l13.4 13.4M18.7 5.3 5.3 18.7"/>'},
  codex:      {c:"#e7ecf7", p:'<rect x="2.5" y="4" width="19" height="16" rx="3"/><path d="m7 9.5 3 2.5-3 2.5M12.5 15h4.5"/>'},
  gmail:      {c:"#ff6b6b", p:'<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/>'},
  drive:      {c:"#4ade80", p:'<path d="M8.5 3.5h7l6 10.5-3.5 6h-12L2.5 14z"/><path d="M8.5 3.5 15 14.5M15.5 3.5 9 14.5M2.5 14h19"/>'},
  fireflies:  {c:"#b18cff", p:'<path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/>'},
  github:     {c:"#e7ecf7", p:'<circle cx="6" cy="5.5" r="2.3"/><circle cx="6" cy="18.5" r="2.3"/><circle cx="18" cy="8" r="2.3"/><path d="M6 7.8v8.4M18 10.3c0 4-6 3.5-10.2 6.6"/>'},
  local:      {c:"#9fb0d0", p:'<path d="M6 2.5h8l5 5v14H6z"/><path d="M14 2.5v5h5"/>'},
  after:      {c:"#7fa8ff", p:'<path d="M4 6.5l2 2 3.5-3.5M4 13.5l2 2 3.5-3.5M12.5 7h7.5M12.5 14h7.5M4 20.5h16"/>'},
  person:     {c:"#cfe0ff", p:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4.5 4.5-6.5 8-6.5s6.5 2 8 6.5"/>'},
  master:     {c:"#cfe0ff", p:'<rect x="3" y="3.5" width="18" height="6.5" rx="2"/><rect x="3" y="14" width="18" height="6.5" rx="2"/><path d="M7 6.8h.01M7 17.3h.01"/>'},
  brief:      {c:"#ffffff", p:'<path d="M12 2.5l2.2 6.3 6.3 2.2-6.3 2.2L12 19.5l-2.2-6.3L3.5 11l6.3-2.2z"/>'},
  decision:   {c:"#7fa8ff", p:'<path d="M12 3 21 12l-9 9-9-9z"/><path d="m8.5 12 2.5 2.5 4.5-4.5"/>'},
  item:       {c:"#9cc0ff", p:'<circle cx="12" cy="12" r="5"/>'},
};
const svgIcon = (k, size = 16, color) => { const i = ICON[k] || ICON.item;
  return `<svg class="icon" viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="${color || i.c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${i.p}</svg>`; };
const IMG = {};
function loadIcons(){ return Promise.all(Object.keys(ICON).map(k => new Promise(res => {
  const im = new Image(); im.onload = () => { IMG[k] = im; res(); }; im.onerror = res;
  im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgIcon(k, 96).replace('class="icon" ', 'xmlns="http://www.w3.org/2000/svg" ')); }))); }

/* ======================= state ======================= */
const SRC = {claude_code:"Claude Code",codex:"Codex",gmail:"Gmail",drive:"Drive",fireflies:"Fireflies",github:"GitHub",local:"Local files",after:"After records"};
const KIND = {session:"Session",pr:"Pull request",issue:"Issue",commit:"Commits",meeting:"Meeting",doc:"Doc"};
let CFG = {people:{}}, RUN = null, after = 0, timer = null;
const S = {actors:new Map(), sources:new Map(), stage:"idle", lines:new Map()};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const name = id => id === "master" ? "Shared sources" : (CFG.people[id] || id.charAt(0).toUpperCase() + id.slice(1));
const initials = n => n.split(/\s+/).map(p => p[0]).join("").slice(0,2).toUpperCase();

/* ======================= tabs + run control ======================= */
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => show(b.dataset.v));
function show(v){
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("on", s.id === "v-" + v));
  if (v === "tasks") loadTasks();
  if (v === "context") setTimeout(resize, 0);
}
$("#go").onclick = async () => {
  const r = await fetch("/api/runs", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({since:$("#since").value, meeting:$("#meeting").value})});
  const j = await r.json(); if (!r.ok && !j.id) return alert(j.error);
  resetAll(); G.live = true; attach(j.id); show("context");
};
function attach(id){ clearInterval(timer); timer = setInterval(() => poll(id), 500); poll(id); }
async function poll(id){
  const r = await fetch(`/api/runs/${id}?after=${after}`); if (!r.ok) return;
  const run = await r.json(); RUN = run;
  run.events.forEach(apply); after += run.events.length;
  setStatus(run.status, run.status === "running" ? stageLabel() : run.status === "done" ? "brief ready" : (run.error || run.status));
  $("#go").disabled = run.status === "running";
  if (run.status !== "running"){ clearInterval(timer); if (run.brief){ S.stage = "done"; renderBrief(run); now("brief", "team brief", "ready · click the center to read it", false); setTimeout(() => $("#now").classList.remove("on"), 6000); }
    else if (run.status === "error") now("brief", "error", esc(run.error || "run failed"), false); }
  syncGraph(); renderSide(); renderProgress();
}

// Radial 3D layout: brief at the center, people on a tilted ring, their apps fanned outward, items as a small cloud.
function place(){
  const snap = RUN?.status === "done" && !G.live;  // opening a finished run: no glide
  const set = (n, x, y, z) => { if (n){ n.tx = x; n.ty = y; n.tz = z; if (snap || n.placed === undefined && snap){ n.fx = x; n.fy = y; n.fz = z; } n.placed = true; } };

  const actors = [...S.actors.values()].sort((a, b) => (a.id === "master") - (b.id === "master")), R = 62;
  actors.forEach((a, i) => {
    const ang = i * 2*Math.PI / actors.length, dx = Math.cos(ang), dz = Math.sin(ang), hy = (i % 2 ? 1 : -1) * 10;
    const hx = dx*R, hz = dz*R; set(G.byId.get("hub:" + a.id), hx, hy, hz);
    const m = a.sources.length;
    a.sources.forEach((src, j) => {
      const off = m > 1 ? (-0.7 + 1.4*j/(m-1)) : 0, ca = ang + off, r2 = 34, sy = hy + (j - (m-1)/2) * 9;
      const sx = hx + Math.cos(ca)*r2, sz = hz + Math.sin(ca)*r2; set(G.byId.get(`src:${a.id}/${src}`), sx, sy, sz);
      const items = G.nodes.filter(n => n.type === "item" && n.actor === a.id && n.src === src), k = items.length;
      items.forEach((it, q) => {   // fibonacci sphere around the app, nudged outward

  if (briefLinked) return; briefLinked = true;
  const all = JSON.stringify(b); G.nodes.forEach(n => { if (n.type === "item" && all.includes(":" + n.itemId + '"')) n.cited = true; });
  (b.meeting_goals || []).forEach((g, i) => {
    const id = "dec:" + i, short = g.text.replace(/^(decide|pick|choose|agree)\s+(on\s+|whether\s+|who\s+|if\s+)?/i, m => /who/i.test(m) ? "who " : "").replace(/^./, c => c.toUpperCase());
    ensureNode({id, type:"decision", label: short.length > 30 ? short.slice(0, 29) + "…" : short, full:g.text, evidence:g.evidence, sub:"decide", status:"done"}, "center");
    ensureLink(id, "center", "decision", "ok");
    (g.evidence || []).forEach(ev => { const n = evidenceNode(ev); if (n) ensureLink(id, n.id, "evidence", "ok"); });
  });
  G.changed = true;
}

/* ---------- selection + details ---------- */
function neighbors(n){ const s = new Set([n.id]); G.links.forEach(l => { const a = l.source.id ?? l.source, b = l.target.id ?? l.target;
  if (a === n.id) s.add(b); if (b === n.id) s.add(a); });
  if (n.type === "hub") G.nodes.forEach(m => m.actor === n.actor && s.add(m.id));
  return s; }
const dimmed = n => !!focusSet && !focusSet.has(n.id ?? n);
function select(n){
  selected = n || null; focusSet = n && n.type !== "center" ? neighbors(n) : null;
  G.nodes.forEach(m => { const o = m.__threeObj; if (!o) return; o.traverse(c => { if (c.material && c !== o.userData?.glow) c.material.opacity = dimmed(m) ? .12 : 1; });
    if (o.userData?.glow) o.userData.glow.material.opacity = dimmed(m) ? .03 : o.userData.glowOpacity; });
  graph.nodeColor(graph.nodeColor()).linkColor(graph.linkColor());
  document.querySelectorAll(".term").forEach(t => t.classList.toggle("sel", !!n && t.dataset.id === n.actor));
  if (!n){ closeDrawer(); return; }
  graph.controls().autoRotate = false; idle = Date.now();
  const d = n.type === "center" ? 190 : n.type === "item" ? 40 : 70, r = Math.hypot(n.x, n.y, n.z) || 1;
  const pos = n.type === "center" ? {x:0, y:70, z:190} : {x:n.x*(1 + d/r), y:n.y*(1 + d/r), z:n.z*(1 + d/r)};
  graph.cameraPosition(pos, n, 1100);
  openDrawer(n);
}
function personBrief(actorId){
  const b = RUN?.brief; if (!b?.people || actorId === "master") return null; const nm = name(actorId).toLowerCase();
  return b.people.find(p => p.name.toLowerCase() === nm || p.name.toLowerCase().slice(0, 4) === actorId.slice(0, 4).toLowerCase());
}
function citedIn(n){ const b = RUN?.brief; if (!b) return []; const out = [], needle = ":" + n.itemId;
  (b.people || []).forEach(p => ["progress","wip","next"].forEach(k => (p[k] || []).forEach(i => (i.evidence || []).some(e => e.endsWith(needle)) && out.push([p.name + " · " + k, i.text]))));
  (b.meeting_goals || []).forEach(g => (g.evidence || []).some(e => e.endsWith(needle)) && out.push(["decide", g.text]));
  return out; }
const BUCKETS = [["progress","Progress so far","#1f9d63"],["wip","Work in progress","#2f6bff"],["next","Next steps","#141a26"]];
function openDrawer(n){
  let h = `<span class="x" onclick="select(null)">✕</span>`;
  if (n.type === "center"){
    const b = RUN?.brief;
    h += `<div class="caps">Team brief</div><h3>${b ? esc(b.team_goal || b.headline) : "Collecting context…"}</h3>`;
    h += `<div class="sub">${[...S.actors.values()].filter(a => a.id !== "master").length} laptops · ${G.nodes.filter(x => x.type === "item").length} items gathered</div>`;
    if (b?.meeting_goals?.length) h += `<div class="sec"><div class="caps">Decide in this meeting</div>${b.meeting_goals.map((g, i) => `<div class="row link" onclick="select(G.byId.get('dec:${i}'))"><span class="ic">${svgIcon("decision", 14)}</span><span>${esc(g.text)}</span></div>`).join("")}</div>`;
    if (b) h += `<div class="sec"><button class="btn" onclick="show('brief')">Open full brief →</button></div>`;
  } else if (n.type === "hub"){
    const a = S.actors.get(n.actor), pb = personBrief(n.actor);
    h += `<div class="caps">${n.actor === "master" ? "Master · shared sources" : "Laptop · worker " + esc(n.actor)}</div><h3>${esc(name(n.actor))}</h3><div class="sub">status: ${esc(a.status)}</div>`;
    if (pb) h += BUCKETS.map(([k, label, c]) => (pb[k] || []).length ? `<div class="sec"><div class="caps" style="color:${c}">${label}</div>${pb[k].map(i => `<div class="row"><span>${esc(i.text)}</span></div>`).join("")}</div>` : "").join("");
    h += `<div class="sec"><div class="caps">Sources</div>${a.sources.map(s => { const x = S.sources.get(n.actor + "/" + s);
      return `<div class="row link" onclick="select(G.byId.get('src:${n.actor}/${s}'))"><span class="ic">${svgIcon(s, 14)}</span><span>${SRC[s] || s}</span><span class="tag" style="margin-left:auto">${x.state === "ok" ? x.items + " items" : esc(x.state)}</span></div>`; }).join("")}</div>`;
  } else if (n.type === "source"){
    const s = S.sources.get(n.actor + "/" + n.src);
    h += `<div class="caps">${esc(name(n.actor))} · source</div><h3 style="display:flex;gap:10px;align-items:center">${svgIcon(n.src, 20)}${esc(n.label)}</h3>
      <div class="sub">${s.state === "ok" ? `${s.items} items found` : esc(s.reason || s.state)}</div>`;
    h += (s.titles || []).map(it => { const node = G.byId.get(`item:${n.actor}:${it.id}`);
      return `<div class="row link" onclick="select(G.byId.get('item:${n.actor}:${esc(it.id)}'))"><span class="ic">${svgIcon("item", 12, node?.cited ? "#7fa8ff" : "#c9d0dc")}</span><span>${esc(it.title)}</span>${node?.cited ? `<span class="tag cited" style="margin-left:auto">cited</span>` : ""}</div>`; }).join("");
  } else if (n.type === "item"){
    const cites = citedIn(n);
    h += `<div class="caps">${esc(SRC[n.src] || n.src)} · ${esc(KIND[n.kind] || n.kind || "item")} · ${esc(name(n.actor))}</div><h3>${esc(n.title)}</h3>`;
    if (n.url) h += `<div class="sub"><a href="${esc(n.url)}" target="_blank">Open source ↗</a></div>`;
    h += `<div class="sec"><div class="caps">${cites.length ? "Used in the brief" : RUN?.brief ? "Not cited in the brief" : "Brief not ready yet"}</div>${cites.map(([w, t]) => `<div class="row"><span class="tag cited">${esc(w)}</span><span>${esc(t)}</span></div>`).join("")}</div>`;
  } else if (n.type === "decision"){
    h += `<div class="caps">Decide in this meeting</div><h3>${esc(n.full)}</h3><div class="sec"><div class="caps">Based on</div>${(n.evidence || []).map(ev => { const m = evidenceNode(ev);
      return m ? `<div class="row link" onclick="select(G.byId.get('${m.id}'))"><span class="ic">${svgIcon(m.src, 14)}</span><span>${esc(m.title)}</span></div>` : `<div class="row"><span class="tag">${esc(ev)}</span></div>`; }).join("") || `<div class="row">No linked sources.</div>`}</div>`;
  }
  $("#drawer").innerHTML = h; $("#drawer").classList.add("on");
}
function closeDrawer(){ $("#drawer").classList.remove("on"); }

/* ---------- side + progress ---------- */
function renderSide(){
  const side = $("#side"), ids = [...S.actors.keys()].sort((a, b) => (a === "master") - (b === "master"));
  ids.forEach(id => {
    let el = side.querySelector(`.term[data-id="${id}"]`);
    if (!el){ el = document.createElement("div"); el.className = "term"; el.dataset.id = id; el.onclick = () => select(G.byId.get("hub:" + id));
      el.innerHTML = `<div class="hd"><span class="av">${id === "master" ? "⌂" : initials(name(id))}</span><b></b><span class="role"></span><span class="st"></span></div><div class="body"></div>`; side.appendChild(el); }
    const a = S.actors.get(id), st = id === "master" ? (RUN?.status === "done" ? "done" : S.stage === "merging" ? "merging" : "gathering") : a.status;
    el.querySelector("b").textContent = name(id); el.querySelector(".role").textContent = id === "master" ? "master" : "laptop";
    const s = el.querySelector(".st"); s.className = "st " + st; s.textContent = (st || "").replace("_", " ");
    const body = el.querySelector(".body"), lines = S.lines.get(id) || [];
    for (let i = body.children.length; i < lines.length; i++){ const d = document.createElement("div"); d.className = "ln new"; d.innerHTML = lines[i]; body.appendChild(d); }
  });
}
function renderProgress(){
  if (!S.actors.size){ $("#progress").innerHTML = ""; return; }
  const workers = [...S.actors.values()].filter(a => a.id !== "master"), done = workers.filter(a => ["complete","failed","timed_out"].includes(a.status)).length;
  const reached = RUN?.status === "done" ? 4 : S.stage === "merging" ? 3 : workers.some(a => ["summarizing","complete"].includes(a.status)) ? 2 : 1;
  $("#progress").innerHTML = ["Gather", "Summarize", "Merge", "Brief"].map((label, i) =>
    `<span class="step ${i < reached - 1 || RUN?.status === "done" ? "done" : ""} ${i === reached - 1 && RUN?.status !== "done" ? "on" : ""}">${label}${label === "Gather" ? ` ${done}/${workers.length}` : ""}</span>`).join('<span class="sep"></span>');
}

/* ======================= brief ======================= */
function chip(ids, index){ const id = (ids || [])[0]; if (!id) return "";
  const meta = index[id] || {}, key = id.split(":").pop(), label = key.replace(/^GH-/, "").replace("ISSUE-", "#").replace("PR-", "PR #");
  return `<a class="chip" ${meta.url ? `href="${esc(meta.url)}" target="_blank"` : ""} data-tip="${esc(meta.title || key)}">${esc(label)}</a>`; }
function renderBrief(run){
  const b = run.brief || {}, idx = run.index || {};
  if (!b.people){ $("#brief").innerHTML = `<div class="note">This brief has no per-person view.</div>`; return; }
  const actorFor = p => [...S.actors.keys()].find(a => personBrief(a) === p);
  const people = b.people.map(p => { const a = actorFor(p);
    return `<div class="person"><div class="who"><span class="av">${initials(p.name)}</span><b>${esc(p.name)}</b>${a ? `<button class="btn ghost" onclick="show('context');setTimeout(()=>select(G.byId.get('hub:${a}')),50)">in graph</button>` : ""}</div>
    ${BUCKETS.map(([k, label, c]) => (p[k] || []).length ? `<div class="bucket" style="--c:${c}"><div class="caps">${label}</div><ul>${p[k].map(i => `<li><span>${esc(i.text)}</span>${chip(i.evidence, idx)}</li>`).join("")}</ul></div>` : "").join("") || `<div class="note">Nothing reported.</div>`}</div>`; }).join("");
  const decide = (b.meeting_goals || []).map(g => `<label><input type="checkbox"><span>${esc(g.text)}</span>${chip(g.evidence, idx)}</label>`).join("");
  const sec = (title, arr, f) => arr && arr.length ? `<div class="sec"><h3>${title}</h3><ul>${arr.map(f).join("")}</ul></div>` : "";
  $("#brief").innerHTML = `<div class="wrap">
    <div class="goal"><div class="caps">Team goal</div><p>${esc(b.team_goal || b.headline || "")}</p></div>
    <div class="people">${people}</div>
    ${decide ? `<div class="decide"><h3>Decide in this meeting</h3>${decide}</div>` : ""}
    <details class="full"><summary>Full brief · commitments, gaps, actions</summary>
      ${sec("Commitments", b.commitments, c => `<li><span class="badge ${esc(c.status)}">${esc((c.status || "").replace("_", " "))}</span> <b>${esc(c.owner || "")}</b> ${esc(c.what)} ${chip(c.evidence, idx)}</li>`)}
      ${sec("Gaps", b.gaps, g => `<li>${esc(g.description)} <span style="color:var(--mute)">${esc(g.why_it_matters || "")}</span> ${chip(g.evidence, idx)}</li>`)}
      ${sec("Action items", b.action_items, a => `<li><span class="badge ${esc(a.priority)}">${esc(a.priority || "")}</span> ${esc(a.what)} <b>${esc(a.owner || "")}</b> ${chip(a.evidence, idx)}</li>`)}
      ${sec("Dependencies & conflicts", b.dependencies_and_conflicts, d => `<li>${esc(d.description)} ${chip(d.evidence, idx)}</li>`)}
    </details></div>`;
  document.querySelectorAll(".decide input").forEach(i => i.onchange = () => i.parentElement.classList.toggle("done", i.checked));
}
function tip(ev, html){ const t = $("#tip"); t.innerHTML = html; t.style.display = "block"; t.style.left = ev.clientX + 14 + "px"; t.style.top = ev.clientY + 14 + "px"; }
document.addEventListener("mouseover", ev => { const c = ev.target.closest(".chip"); if (c) tip(ev, esc(c.dataset.tip)); });
document.addEventListener("mouseout", ev => { if (ev.target.closest(".chip")) $("#tip").style.display = "none"; });

/* ======================= tasks ======================= */
const COLS = [["todo","To do","#9aa3b5"],["in_progress","In progress","#2f6bff"],["blocked","Blocked","#d9473b"],["done","Done","#1f9d63"]];
let TASKS = [], who = "all", TMETA = null;
async function loadTasks(){ const j = await (await fetch("/api/tasks")).json(); TASKS = j.tasks; TMETA = j; renderTasks(); }
function renderTasks(){
  const owners = [...new Set(TASKS.map(t => t.owner || "unassigned"))], list = TASKS.filter(t => who === "all" || (t.owner || "unassigned") === who);
  $("#tasks").innerHTML = `<div class="wrap" style="max-width:1400px">
    <div class="filters">${["all", ...owners].map(o => `<button class="${o === who ? "on" : ""}" data-o="${esc(o)}">${esc(o === "all" ? "Everyone" : o === "unassigned" ? "Unassigned" : name(o))}</button>`).join("")}</div>
    ${TASKS.length ? "" : `<div class="note">No tasks yet. They appear once the After stage processes a meeting${TMETA && !TMETA.after_db_found ? ` (no After database at ${esc(TMETA.after_db)})` : ""}.</div>`}
    <div class="board">${COLS.map(([k, label, c]) => { const col = list.filter(t => (t.status || "todo") === k);
      return `<div class="col" data-s="${k}"><h4><span class="caps" style="--c:${c}">${label}</span><span class="n">${col.length}</span></h4>${col.map(card).join("")}</div>`; }).join("")}</div></div>`;
  document.querySelectorAll(".filters button").forEach(b => b.onclick = () => { who = b.dataset.o; renderTasks(); });
  document.querySelectorAll(".task[draggable=true]").forEach(c => c.ondragstart = ev => ev.dataTransfer.setData("text", c.dataset.id));
  document.querySelectorAll(".col").forEach(col => {
    col.ondragover = ev => { ev.preventDefault(); col.classList.add("over"); }; col.ondragleave = () => col.classList.remove("over");
    col.ondrop = async ev => { ev.preventDefault(); col.classList.remove("over"); const id = ev.dataTransfer.getData("text"), t = TASKS.find(x => String(x.id) === id); if (!t) return;
      t.status = col.dataset.s; renderTasks(); await fetch(`/api/tasks/${id}`, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({status:t.status})}); };
  });
}
function card(t){
  const own = t.owner ? `<span class="av" title="${esc(name(t.owner))}">${initials(name(t.owner))}</span>` : `<span class="flag">unassigned</span>`;
  const flags = (t.flags || []).filter(f => f && f !== "unassigned").map(f => `<span class="flag">${esc(f.replace("_", " "))}</span>`).join("");
  return `<div class="task ${t.origin === "after" ? "" : "ro"}" draggable="${t.origin === "after"}" data-id="${esc(t.id)}" title="${esc(t.quote || "")}">
    <div class="t">${esc(t.title)}</div><div class="meta">${own}${t.due ? `<span class="badge">due ${esc(t.due)}</span>` : ""}${flags}
    ${t.url ? `<a class="chip" href="${esc(t.url)}" target="_blank">issue ↗</a>` : ""}<span class="org">${t.origin === "after" ? esc(t.channel || "after") : "brief"}</span></div></div>`;
}

/* ======================= boot ======================= */
(async () => {
  await document.fonts.ready; await loadIcons(); initGraph();
  CFG = await (await fetch("/api/config")).json();
  if (CFG.demo) $("#go").innerHTML = "▶ Generate prep <span style='opacity:.65'>· demo</span>";
  const r = await fetch("/api/runs/latest");
  if (r.ok){ const run = await r.json(); G.live = run.status === "running"; attach(run.id); } else syncGraph();
  // Pick up runs started elsewhere (Slack @agent, another browser) and animate them live.
  setInterval(async () => {
    const x = await fetch("/api/runs/latest?after=999999"); if (!x.ok) return;
    const run = await x.json();
    if (run.id !== RUN?.id && run.status === "running"){ resetAll(); G.live = true; attach(run.id); show("context"); }
  }, 2500);
})();
</script>
</body>
