<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Charlotte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.73.3/dist/3d-force-graph.min.js"></script>
<style>
/* Design tokens: one accent, neutral greys, two radii, 4px spacing scale. */
:root{
  --bg:#f7f8fa; --surface:#ffffff; --sunken:#f1f3f6; --line:#e4e7ec; --line-strong:#d0d5dd;
  --ink:#15171c; --ink-2:#475467; --mute:#8a94a6;
  --accent:#2457e6; --accent-soft:#e8eefc;
  --ok:#14915a; --ok-soft:#e5f4ec; --err:#d0342c; --err-soft:#fbe9e7; --idle:#a0a8b6;
  --r-sm:6px; --r-md:10px;
  --sans:Inter,-apple-system,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
.label{font-size:12px;font-weight:500;color:var(--mute)}
.num{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
header{height:56px;display:flex;align-items:center;gap:28px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:10}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-weight:600;font-size:15px;letter-spacing:-.01em}
.brand .tagline{color:var(--mute);font-size:13px}
.brand .demo{font-size:11px;font-weight:500;color:var(--ink-2);background:var(--sunken);border:1px solid var(--line);border-radius:var(--r-sm);padding:1px 6px;display:none}
.tabs{display:flex;gap:20px;height:100%}
.tabs button{all:unset;cursor:pointer;height:100%;display:flex;align-items:center;font-size:14px;font-weight:500;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.controls{margin-left:auto;display:flex;align-items:center;gap:8px}
.field{height:34px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);padding:0 10px;font:14px var(--sans);color:var(--ink);outline:none}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#meeting{width:220px}
.primary{all:unset;cursor:pointer;height:34px;padding:0 14px;border-radius:var(--r-sm);background:var(--ink);color:#fff;font-size:14px;font-weight:500;display:inline-flex;align-items:center}
.primary:hover{background:#000}.primary[disabled]{background:var(--line-strong);cursor:default}
.secondary{all:unset;cursor:pointer;height:30px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--line-strong);background:var(--surface);font-size:13px;font-weight:500;display:inline-flex;align-items:center}
.secondary:hover{background:var(--sunken)}

main{position:absolute;top:56px;left:0;right:0;bottom:0}
.view{position:absolute;inset:0;display:none}.view.on{display:block}

/* ---------- graph view ---------- */
#v-context.on{display:grid;grid-template-columns:1fr 340px}
.stage{position:relative;overflow:hidden}
#graph{position:absolute;inset:0}
.scene-tooltip:empty{display:none!important}
.scene-tooltip{font:13px var(--sans)!important;background:var(--surface)!important;color:var(--ink)!important;border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 9px!important;max-width:320px;box-shadow:0 4px 16px rgba(16,24,40,.08)}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--ink-2);pointer-events:none}
.empty h2{font-size:18px;font-weight:600;color:var(--ink);margin:0 0 6px}
.legend{position:absolute;left:20px;bottom:16px;display:flex;gap:16px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}
#floats{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fl{position:absolute;transform:translate(10px,-50%);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:4px 8px 4px 6px;
  font-size:12px;color:var(--ink);white-space:nowrap;display:flex;gap:6px;align-items:center;box-shadow:0 4px 12px rgba(16,24,40,.08);animation:fadein .3s ease-out;transition:opacity .6s}
.fl .src{color:var(--mute)}
@keyframes fadein{from{opacity:0;transform:translate(4px,-50%)}}

/* node details */
#drawer{position:absolute;left:16px;top:16px;width:360px;max-height:calc(100% - 64px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  box-shadow:0 8px 24px rgba(16,24,40,.08);display:none}
#drawer.on{display:block;animation:fadein .15s}
#drawer .head{padding:14px 16px 10px;border-bottom:1px solid var(--line);position:relative}
#drawer .head h3{margin:2px 0 0;font-size:16px;font-weight:600;line-height:1.35;padding-right:20px}
#drawer .head .meta{color:var(--ink-2);font-size:13px;margin-top:4px}
#drawer .x{position:absolute;right:12px;top:12px;cursor:pointer;color:var(--mute);border:0;background:none;font-size:16px;line-height:1}
#drawer .x:hover{color:var(--ink)}
#drawer .sec{padding:10px 16px 12px;border-bottom:1px solid var(--line)}#drawer .sec:last-child{border-bottom:0}
#drawer .sec .label{margin-bottom:4px}
#drawer .row{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:13px;line-height:1.45}
#drawer .row.link{cursor:pointer;border-radius:var(--r-sm);margin:0 -6px;padding:6px}
#drawer .row.link:hover{background:var(--sunken)}
#drawer .row .ic{flex:none;margin-top:1px}
#drawer .tag{margin-left:auto;font-size:12px;color:var(--mute);white-space:nowrap}
#drawer .tag.cited{color:var(--accent)}
#drawer a.out{color:var(--accent);text-decoration:none;font-size:13px}
.icon{display:block}

/* sidebar */
#side{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.panel{padding:16px 18px;border-bottom:1px solid var(--line)}
.run-title{font-size:15px;font-weight:600}
.run-meta{font-size:13px;color:var(--ink-2);margin-top:2px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--idle);flex:none}
.dot.running{background:var(--accent);animation:pulse 1.2s ease-in-out infinite}.dot.done{background:var(--ok)}.dot.error{background:var(--err)}
@keyframes pulse{50%{opacity:.35}}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.steps div{font-size:12px;color:var(--mute)}
.steps div::before{content:"";display:block;height:3px;border-radius:2px;background:var(--line);margin-bottom:6px}
.steps .done{color:var(--ink-2)}.steps .done::before{background:var(--ink)}
.steps .on{color:var(--ink);font-weight:500}.steps .on::before{background:var(--accent)}
.section-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.people-list{display:flex;flex-direction:column}
.person-row{display:grid;grid-template-columns:28px 1fr auto;gap:2px 10px;align-items:center;padding:8px;margin:0 -8px;border-radius:var(--r-sm);cursor:pointer}
.person-row:hover{background:var(--sunken)}.person-row.sel{background:var(--accent-soft)}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;background:var(--sunken);color:var(--ink-2);border:1px solid var(--line)}
.person-row .nm{font-size:14px;font-weight:500}
.person-row .st{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
.person-row .st.running{color:var(--accent)}.person-row .st.done{color:var(--ok)}.person-row .st.error{color:var(--err)}
.person-row .srcs{grid-column:2 / 4;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--ink-2)}
.person-row .srcs span{display:inline-flex;align-items:center;gap:4px}.person-row .srcs .skip{color:var(--idle)}
.person-row .srcs .busy{color:var(--accent)}
.activity{flex:1;min-height:0;overflow:auto;padding:16px 18px}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:5px 0;font-size:13px;color:var(--ink-2);animation:fadein .25s ease-out}
.feed li .t{color:var(--mute)}
.feed li b{color:var(--ink);font-weight:500}
.feed li:first-child{color:var(--ink)}

/* ---------- brief ---------- */
#brief,#tasks{height:100%;overflow:auto}
.doc{max-width:1080px;margin:0 auto;padding:36px 32px 64px}
.doc .kicker{font-size:13px;font-weight:500;color:var(--mute)}
.doc h1{font-size:28px;font-weight:600;letter-spacing:-.02em;margin:4px 0 6px}
.doc .byline{font-size:13px;color:var(--ink-2)}
.doc .lead{font-size:18px;line-height:1.55;color:var(--ink);max-width:760px;margin:20px 0 32px}
.doc h2{font-size:15px;font-weight:600;margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.decisions{list-style:none;margin:0 0 36px;padding:0;counter-reset:d}
.decisions li{display:grid;grid-template-columns:22px 18px 1fr;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line);counter-increment:d}
.decisions li::before{content:counter(d);font:500 13px var(--mono);color:var(--mute);padding-top:1px}
.decisions input{margin-top:3px;accent-color:var(--ink)}
.decisions li.checked span{color:var(--mute);text-decoration:line-through}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px 28px;margin-bottom:36px}
.who{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.who b{font-size:15px;font-weight:600}.who .secondary{margin-left:auto;height:26px;font-size:12px;padding:0 9px}
.bucket{margin-top:12px}
.bucket .label{margin-bottom:2px}
.bucket ul{margin:0;padding-left:16px}
.bucket li{margin:5px 0;color:var(--ink);line-height:1.5}
.bucket li::marker{color:var(--line-strong)}
sup.ref{font:500 10px var(--mono);color:var(--accent);cursor:pointer;margin-left:2px}
sup.ref a{text-decoration:none}
.sources{list-style:none;margin:0;padding:0;columns:2;column-gap:28px;font-size:13px}
.sources li{break-inside:avoid;display:grid;grid-template-columns:26px 1fr;padding:4px 0;color:var(--ink-2)}
.sources li .n{font-family:var(--mono);color:var(--mute)}
.sources a{color:var(--ink);text-decoration:none}.sources a:hover{color:var(--accent)}
details.more{margin-top:28px}
details.more summary{cursor:pointer;font-size:14px;font-weight:500;color:var(--ink-2);padding:8px 0}
details.more .blk{margin-top:16px}
details.more ul{padding-left:18px;margin:6px 0}details.more li{margin:6px 0}
.status-t{font-size:12px;font-weight:500;padding:1px 6px;border-radius:var(--r-sm);background:var(--sunken);color:var(--ink-2)}
.status-t.done{background:var(--ok-soft);color:var(--ok)}.status-t.in_progress{background:var(--accent-soft);color:var(--accent)}
.status-t.no_evidence,.status-t.high{background:var(--err-soft);color:var(--err)}
.note{color:var(--mute);text-align:center;margin:64px auto}
#tip{position:fixed;pointer-events:none;z-index:50;background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:var(--r-sm);max-width:320px;display:none}

/* ---------- tasks ---------- */
.tasks-head{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.tasks-head h1{font-size:22px;margin:0}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.seg button{all:unset;cursor:pointer;padding:5px 12px;font-size:13px;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}.seg button.on{background:var(--ink);color:#fff}
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:16px;align-items:start}
.col{min-height:220px;border-radius:var(--r-md);padding:4px;transition:background .15s}
.col.over{background:var(--accent-soft)}
.col h3{font-size:13px;font-weight:600;margin:4px 6px 10px;display:flex;gap:8px;align-items:center}
.col h3 .num{color:var(--mute);font-weight:400}
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px;margin-bottom:8px;cursor:grab}
.task:hover{border-color:var(--line-strong)}.task.ro{cursor:default}
.task .t{font-size:14px;font-weight:500;line-height:1.4}
.task .meta{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.task .meta .av{width:20px;height:20px;font-size:9px}
.task .warn{color:var(--err)}
.task .src{margin-left:auto;color:var(--mute)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#15171c" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="2.6" fill="#15171c"/><circle cx="4" cy="6" r="1.6"/><circle cx="20" cy="5" r="1.6"/><circle cx="19" cy="19" r="1.6"/><circle cx="5" cy="19" r="1.6"/><path d="M10 10.5 5.3 7M14 10.4l4.7-4.2M14 13.6l3.8 4.2M10.1 13.7l-3.9 4.1"/></svg>
    <b>Charlotte</b><span class="tagline">Connects your work</span><span class="demo" id="demo">Demo data</span>
  </div>
  <nav class="tabs">
    <button data-v="context" class="on">Graph</button>
    <button data-v="brief">Brief</button>
    <button data-v="tasks">Tasks</button>
  </nav>
  <div class="controls">
    <select id="since" class="field"><option value="7d">Last 7 days</option><option value="14d" selected>Last 14 days</option><option value="30d">Last 30 days</option></select>
    <input id="meeting" class="field" placeholder="Meeting name (optional)">
    <button class="primary" id="go">Generate prep</button>
  </div>
</header>

<main>
  <section class="view on" id="v-context">
    <div class="stage">
      <div id="graph"></div>
      <div id="floats"></div>
      <div class="empty" id="empty"><div><h2>No prep yet</h2>Generate a prep to see each teammate's context come together.</div></div>
      <div id="drawer"></div>
      <div class="legend"><span><i style="background:var(--idle)"></i>Waiting</span><span><i style="background:var(--accent)"></i>Working</span><span><i style="background:var(--ok)"></i>Done</span><span><i style="background:var(--err)"></i>Failed</span><span>Drag to rotate · scroll to zoom · click a node</span></div>
    </div>
    <aside id="side">
      <div class="panel" id="runpanel">
        <div class="run-title" id="runtitle">No prep running</div>
        <div class="run-meta"><span class="dot" id="rundot"></span><span id="runmeta">Idle</span></div>
        <div class="steps" id="steps"></div>
      </div>
      <div class="panel">
        <div class="section-h"><span class="label">Contributors</span><span class="num" id="contrib-count" style="color:var(--mute)"></span></div>
        <div class="people-list" id="people"></div>
      </div>
      <div class="activity">
        <div class="section-h"><span class="label">Activity</span></div>
        <ul class="feed" id="feed"></ul>
      </div>
    </aside>
  </section>
  <section class="view" id="v-brief"><div id="brief"><div class="note">The brief appears here when a prep finishes.</div></div></section>
  <section class="view" id="v-tasks"><div id="tasks"></div></section>
</main>
<div id="tip"></div>
<script>
/* ======================= icons ======================= */
// 24×24 stroke icons. Colors are app-recognizable accents on the blue theme.
const ICON = {
  claude_code:{c:"#ff9a6b", p:'<path d="M12 2.5v19M2.5 12h19M5.3 5.3l13.4 13.4M18.7 5.3 5.3 18.7"/>'},
  codex:      {c:"#e7ecf7", p:'<rect x="2.5" y="4" width="19" height="16" rx="3"/><path d="m7 9.5 3 2.5-3 2.5M12.5 15h4.5"/>'},
  gmail:      {c:"#ff6b6b", p:'<rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/>'},
  drive:      {c:"#4ade80", p:'<path d="M8.5 3.5h7l6 10.5-3.5 6h-12L2.5 14z"/><path d="M8.5 3.5 15 14.5M15.5 3.5 9 14.5M2.5 14h19"/>'},
  fireflies:  {c:"#b18cff", p:'<path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/>'},
  github:     {c:"#e7ecf7", p:'<circle cx="6" cy="5.5" r="2.3"/><circle cx="6" cy="18.5" r="2.3"/><circle cx="18" cy="8" r="2.3"/><path d="M6 7.8v8.4M18 10.3c0 4-6 3.5-10.2 6.6"/>'},
  local:      {c:"#9fb0d0", p:'<path d="M6 2.5h8l5 5v14H6z"/><path d="M14 2.5v5h5"/>'},
  after:      {c:"#7fa8ff", p:'<path d="M4 6.5l2 2 3.5-3.5M4 13.5l2 2 3.5-3.5M12.5 7h7.5M12.5 14h7.5M4 20.5h16"/>'},
  person:     {c:"#cfe0ff", p:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4.5 4.5-6.5 8-6.5s6.5 2 8 6.5"/>'},
  master:     {c:"#cfe0ff", p:'<rect x="3" y="3.5" width="18" height="6.5" rx="2"/><rect x="3" y="14" width="18" height="6.5" rx="2"/><path d="M7 6.8h.01M7 17.3h.01"/>'},
  brief:      {c:"#ffffff", p:'<path d="M12 2.5l2.2 6.3 6.3 2.2-6.3 2.2L12 19.5l-2.2-6.3L3.5 11l6.3-2.2z"/>'},
  decision:   {c:"#7fa8ff", p:'<path d="M12 3 21 12l-9 9-9-9z"/><path d="m8.5 12 2.5 2.5 4.5-4.5"/>'},
  item:       {c:"#9cc0ff", p:'<circle cx="12" cy="12" r="5"/>'},
};
const svgIcon = (k, size = 16, color = "#475467") => { const i = ICON[k] || ICON.item;
  return `<svg class="icon" viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${i.p}</svg>`; };
const IMG = {}, IMGW = {};
function loadIcons(){ const one = (k, color, into) => new Promise(res => { const im = new Image(); im.onload = () => { into[k] = im; res(); }; im.onerror = res;
    im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgIcon(k, 96, color).replace('class="icon" ', 'xmlns="http://www.w3.org/2000/svg" ')); });
  return Promise.all(Object.keys(ICON).flatMap(k => [one(k, "#15171c", IMG), one(k, "#ffffff", IMGW)])); }

/* ======================= state ======================= */
const SRC = {claude_code:"Claude Code",codex:"Codex",gmail:"Gmail",drive:"Drive",fireflies:"Fireflies",github:"GitHub",local:"Local files",after:"After records"};
const KIND = {session:"Session",pr:"Pull request",issue:"Issue",commit:"Commits",meeting:"Meeting",doc:"Doc"};
let CFG = {people:{}}, RUN = null, after = 0, timer = null, curTs = 0;
const S = {actors:new Map(), sources:new Map(), stage:"idle", lines:new Map(), feed:[]};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const name = id => id === "master" ? "Shared sources" : (CFG.people[id] || id.charAt(0).toUpperCase() + id.slice(1));
const initials = n => n.split(/\s+/).map(p => p[0]).join("").slice(0,2).toUpperCase();

/* ======================= tabs + run control ======================= */
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => show(b.dataset.v));
function show(v){
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("on", s.id === "v-" + v));
  if (v === "tasks") loadTasks();
  if (v === "context") setTimeout(resize, 0);
}
$("#go").onclick = async () => {
  const r = await fetch("/api/runs", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({since:$("#since").value, meeting:$("#meeting").value})});
  const j = await r.json(); if (!r.ok && !j.id) return alert(j.error);
  resetAll(); G.live = true; attach(j.id); show("context");
};
function attach(id){ clearInterval(timer); timer = setInterval(() => poll(id), 500); poll(id); }
async function poll(id){
  const r = await fetch(`/api/runs/${id}?after=${after}`); if (!r.ok) return;
  const run = await r.json(); RUN = run;
  run.events.forEach(apply); after += run.events.length;
  setStatus(run.status, run.status === "running" ? stageLabel() : run.status === "done" ? `Ready · ${new Date(run.started*1000).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})}` : (run.error || run.status));
  $("#go").disabled = run.status === "running";
  if (run.status !== "running"){ clearInterval(timer); if (run.brief){ S.stage = "done"; renderBrief(run); } }
  syncGraph(); renderSide(); renderProgress();
}
function setStatus(cls, text){

function ensureNode(def, parentId){

    const p = parentId && G.byId.get(parentId), j = () => (Math.random() - .5) * 8;
    const px = p?.fx ?? 0, py = p?.fy ?? 0, pz = p?.fz ?? 0;

    G.nodes.push(n); G.byId.set(n.id, n); G.changed = true;

  if (n.__sig !== sig){ Object.assign(n, def); n.__sig = sig; G.restyle = true; }

function syncGraph(){
  if (!graph) return;

  if (!S.actors.size) return;

  const ws = [...S.actors.values()].filter(a => a.id !== "master"), wdone = ws.filter(a => ["complete","failed","timed_out"].includes(a.status)).length;
  const phase = brief ? "ready · click to read" : S.stage === "merging" ? "merging briefs" : ws.some(a => a.status === "summarizing") ? `summarizing · ${wdone}/${ws.length} done` : `gathering · ${wdone}/${ws.length}`;

    ensureLink(hubId, "center", "hub", S.stage === "merging" ? "merging" : a.id === "master" ? st : st === "complete" ? "ok" : st);

// Radial 3D layout: brief at the center, people on a tilted ring, their apps fanned outward, items as a small cloud.
function place(){
  const snap = RUN?.status === "done" && !G.live;  // opening a finished run: no glide
  const set = (n, x, y, z) => { if (n){ n.tx = x; n.ty = y; n.tz = z; if (snap || n.placed === undefined && snap){ n.fx = x; n.fy = y; n.fz = z; } n.placed = true; } };
  set(G.byId.get("center"), 0, 0, 0);
  const actors = [...S.actors.values()].sort((a, b) => (a.id === "master") - (b.id === "master")), R = 62;
  actors.forEach((a, i) => {
    const ang = i * 2*Math.PI / actors.length, dx = Math.cos(ang), dz = Math.sin(ang), hy = (i % 2 ? 1 : -1) * 10;
    const hx = dx*R, hz = dz*R; set(G.byId.get("hub:" + a.id), hx, hy, hz);
    const m = a.sources.length;
    a.sources.forEach((src, j) => {
      const off = m > 1 ? (-0.7 + 1.4*j/(m-1)) : 0, ca = ang + off, r2 = 34, sy = hy + (j - (m-1)/2) * 9;
      const sx = hx + Math.cos(ca)*r2, sz = hz + Math.sin(ca)*r2; set(G.byId.get(`src:${a.id}/${src}`), sx, sy, sz);
      const items = G.nodes.filter(n => n.type === "item" && n.actor === a.id && n.src === src), k = items.length;
      items.forEach((it, q) => {   // fibonacci sphere around the app, nudged outward
        const yv = 1 - 2*(q + .5)/k, rr = Math.sqrt(1 - yv*yv), th = q * 2.39996, rad = 5 + 1.6*Math.sqrt(k);
        set(it, sx + Math.cos(ca)*5 + rr*Math.cos(th)*rad, sy + yv*rad*.8, sz + Math.sin(ca)*5 + rr*Math.sin(th)*rad);
      });
    });
  });
  const decs = G.nodes.filter(n => n.type === "decision");
  decs.forEach((d, i) => { const a = i * 2*Math.PI / decs.length + .4; set(d, Math.cos(a)*30, 44 + i*5, Math.sin(a)*30); });
}

// After the brief: cited items light up, and each decision links to the items behind it.
function evidenceNode(ev){ const [label, ...rest] = ev.split(":"), id = rest.join(":"), act = label === "shared" ? "master" : label;
  return G.byId.get(`item:${act}:${id}`) || G.nodes.find(n => n.type === "item" && n.itemId === id); }
function linkBrief(b){
  if (briefLinked) return; briefLinked = true;
  const all = JSON.stringify(b); G.nodes.forEach(n => { if (n.type === "item" && all.includes(":" + n.itemId + '"')) n.cited = true; });
  (b.meeting_goals || []).forEach((g, i) => {
    const id = "dec:" + i, short = g.text;
    ensureNode({id, type:"decision", label: short.length > 44 ? short.slice(0, 43) + "…" : short, full:g.text, evidence:g.evidence, sub:"decide", status:"done"}, "center");
    ensureLink(id, "center", "decision", "ok");

}

/* ---------- selection + details ---------- */
function neighbors(n){ const s = new Set([n.id]); G.links.forEach(l => { const a = l.source.id ?? l.source, b = l.target.id ?? l.target;
  if (a === n.id) s.add(b); if (b === n.id) s.add(a); });
  if (n.type === "hub") G.nodes.forEach(m => m.actor === n.actor && s.add(m.id));
  return s; }
const dimmed = n => !!focusSet && !focusSet.has(n.id ?? n);
function select(n){
  selected = n || null; focusSet = n && n.type !== "center" ? neighbors(n) : null;
  G.nodes.forEach(m => { const o = m.__threeObj; if (!o) return; o.traverse(c => { if (c.material && c !== o.userData?.glow) c.material.opacity = dimmed(m) ? .12 : 1; });
    if (o.userData?.glow) o.userData.glow.material.opacity = dimmed(m) ? .03 : o.userData.glowOpacity; });
  graph.nodeColor(graph.nodeColor()).linkColor(graph.linkColor());
  document.querySelectorAll(".person-row").forEach(t => t.classList.toggle("sel", !!n && t.dataset.id === n.actor));
  if (!n){ closeDrawer(); return; }
  graph.controls().autoRotate = false; idle = Date.now();
  const d = n.type === "center" ? 190 : n.type === "item" ? 40 : 70, r = Math.hypot(n.x, n.y, n.z) || 1;
  const pos = n.type === "center" ? {x:0, y:70, z:190} : {x:n.x*(1 + d/r), y:n.y*(1 + d/r), z:n.z*(1 + d/r)};
  graph.cameraPosition(pos, n, 1100);
  openDrawer(n);
}
function personBrief(actorId){
  const b = RUN?.brief; if (!b?.people || actorId === "master") return null; const nm = name(actorId).toLowerCase();
  return b.people.find(p => p.name.toLowerCase() === nm || p.name.toLowerCase().slice(0, 4) === actorId.slice(0, 4).toLowerCase());
}
function citedIn(n){ const b = RUN?.brief; if (!b) return []; const out = [], needle = ":" + n.itemId;
  (b.people || []).forEach(p => ["progress","wip","next"].forEach(k => (p[k] || []).forEach(i => (i.evidence || []).some(e => e.endsWith(needle)) && out.push([p.name + " · " + k, i.text]))));
  (b.meeting_goals || []).forEach(g => (g.evidence || []).some(e => e.endsWith(needle)) && out.push(["decide", g.text]));
  return out; }
const BUCKETS = [["progress","Done"],["wip","In progress"],["next","Next"]];
function openDrawer(n){
  const sec = (label, body) => body ? `<div class="sec"><div class="label">${label}</div>${body}</div>` : "";
  const row = (icon, text, extra = "", onclick = "") => `<div class="row ${onclick ? "link" : ""}" ${onclick ? `onclick="${onclick}"` : ""}><span class="ic">${icon}</span><span>${text}</span>${extra}</div>`;
  let head = "", body = "";
  if (n.type === "center"){
    const b = RUN?.brief;
    head = `<div class="label">Team brief</div><h3>${b ? esc(b.team_goal || b.headline) : "Collecting context…"}</h3>
      <div class="meta">${[...S.actors.values()].filter(a => a.id !== "master").length} laptops · ${G.nodes.filter(x => x.type === "item").length} items</div>`;
    body = sec("Decide in this meeting", (b?.meeting_goals || []).map((g, i) => row(svgIcon("decision", 14), esc(g.text), "", `select(G.byId.get('dec:${i}'))`)).join(""))
         + (b ? `<div class="sec"><button class="secondary" onclick="show('brief')">Open brief</button></div>` : "");
  } else if (n.type === "hub"){
    const a = S.actors.get(n.actor), pb = personBrief(n.actor);
    head = `<div class="label">${n.actor === "master" ? "Shared sources on the master" : "Laptop · " + esc(n.actor)}</div><h3>${esc(name(n.actor))}</h3>`;
    if (pb) body += BUCKETS.map(([k, label]) => sec(label, (pb[k] || []).map(i => row("·", esc(i.text))).join(""))).join("");
    body += sec("Sources", a.sources.map(s => { const x = S.sources.get(n.actor + "/" + s) || {};
      return row(svgIcon(s, 14), SRC[s] || s, `<span class="tag">${x.state === "ok" ? x.items + " items" : esc(x.state || "")}</span>`, `select(G.byId.get('src:${n.actor}/${s}'))`); }).join(""));
  } else if (n.type === "source"){
    const s = S.sources.get(n.actor + "/" + n.src) || {};
    head = `<div class="label">${esc(name(n.actor))}</div><h3 style="display:flex;gap:8px;align-items:center">${svgIcon(n.src, 18, "#15171c")}${esc(n.label)}</h3>
      <div class="meta">${s.state === "ok" ? `${s.items} items in this window` : esc(s.reason || s.state || "")}</div>`;
    body = sec("Items", (s.titles || []).map(it => { const node = G.byId.get(`item:${n.actor}:${it.id}`);
      return row(svgIcon("item", 12, node?.cited ? "#2457e6" : "#a0a8b6"), esc(it.title), node?.cited ? `<span class="tag cited">cited</span>` : "", `select(G.byId.get('item:${n.actor}:${esc(it.id)}'))`); }).join(""));
  } else if (n.type === "item"){
    const cites = citedIn(n);
    head = `<div class="label">${esc(SRC[n.src] || n.src)} · ${esc(KIND[n.kind] || n.kind || "item")} · ${esc(name(n.actor))}</div><h3>${esc(n.title)}</h3>
      ${n.url ? `<div class="meta"><a class="out" href="${esc(n.url)}" target="_blank">Open original ↗</a></div>` : ""}`;
    body = sec(cites.length ? "Used in the brief" : RUN?.brief ? "Not cited in the brief" : "Brief not ready yet", cites.map(([w, t]) => row("·", `${esc(t)} <span style="color:var(--mute)">— ${esc(w)}</span>`)).join("") || " ");
  } else if (n.type === "decision"){
    head = `<div class="label">Decide in this meeting</div><h3>${esc(n.full)}</h3>`;
    body = sec("Based on", (n.evidence || []).map(ev => { const m = evidenceNode(ev);
      return m ? row(svgIcon(m.src, 14), esc(m.title), "", `select(G.byId.get('${m.id}'))`) : row("·", esc(ev)); }).join("") || "No linked sources.");
  }
  $("#drawer").innerHTML = `<div class="head"><button class="x" onclick="select(null)" aria-label="Close">✕</button>${head}</div>${body}`;
  $("#drawer").classList.add("on");
}

function closeDrawer(){ $("#drawer").classList.remove("on"); }

/* ---------- side + progress ---------- */
function renderSide(){
  const ids = [...S.actors.keys()].sort((a, b) => (a === "master") - (b === "master"));
  const WORD = {queued:"Waiting", gathering:"Reading sources", running:"Reading sources", summarizing:"Summarizing", merging:"Merging", complete:"Done", done:"Done", failed:"Failed", timed_out:"No reply", error:"Error"};
  const CLS = s => ACTIVE(s) || s === "queued" && false ? "running" : ["complete","done"].includes(s) ? "done" : ["failed","timed_out","error"].includes(s) ? "error" : "";
  $("#contrib-count").textContent = ids.length ? `${ids.filter(i => i !== "master").length} laptops` : "";
  $("#people").innerHTML = ids.map(id => { const a = S.actors.get(id), st = id === "master" ? (RUN?.status === "done" ? "done" : S.stage === "merging" ? "merging" : "gathering") : a.status;
    const srcs = a.sources.map(s => { const x = S.sources.get(id + "/" + s) || {};
      return `<span class="${x.state === "skipped" ? "skip" : ACTIVE(x.state) ? "busy" : ""}" title="${esc(SRC[s] || s)}">${svgIcon(s, 13, x.state === "skipped" ? "#a0a8b6" : ACTIVE(x.state) ? "#2457e6" : "#475467")}${x.state === "ok" ? x.items : x.state === "skipped" ? "0" : "…"}</span>`; }).join("");
    return `<div class="person-row ${selected?.actor === id ? "sel" : ""}" data-id="${esc(id)}" onclick="select(G.byId.get('hub:${esc(id)}'))">
      <span class="av">${id === "master" ? svgIcon("master", 14) : initials(name(id))}</span><span class="nm">${esc(name(id))}</span>
      <span class="st ${CLS(st)}">${ACTIVE(st) ? '<span class="dot running"></span>' : ""}${WORD[st] || st}</span>${srcs ? `<span class="srcs">${srcs}</span>` : ""}</div>`; }).join("");
  if (S.feedDirty){ S.feedDirty = false; $("#feed").innerHTML = S.feed.map(f => `<li><span class="t num">${f.t}</span><span><b>${esc(f.who)}</b> ${f.html}</span></li>`).join(""); }
}

function renderProgress(){
  if (!S.actors.size){ $("#steps").innerHTML = ""; return; }
  const workers = [...S.actors.values()].filter(a => a.id !== "master"), done = workers.filter(a => ["complete","failed","timed_out"].includes(a.status)).length;
  const reached = RUN?.status === "done" ? 4 : S.stage === "merging" ? 3 : workers.some(a => ["summarizing","complete"].includes(a.status)) ? 2 : 1;
  $("#steps").innerHTML = [`Gather ${done}/${workers.length}`, "Summarize", "Merge", "Brief"].map((label, i) =>
    `<div class="${i < reached - 1 || RUN?.status === "done" ? "done" : i === reached - 1 ? "on" : ""}">${label}</div>`).join("");
}

/* ======================= brief ======================= */
function chip(){ return ""; }

function renderBrief(run){
  const b = run.brief || {}, idx = run.index || {};
  if (!b.people){ $("#brief").innerHTML = `<div class="note">This brief has no per-person view.</div>`; return; }
  const refs = [], refOf = id => { let k = refs.indexOf(id); if (k < 0){ refs.push(id); k = refs.length - 1; } return k + 1; };
  const cite = ev => (ev || []).slice(0, 2).map(id => { const n = refOf(id), m = idx[id] || {};
    return `<sup class="ref" data-tip="${esc(m.title || id)}">${m.url ? `<a href="${esc(m.url)}" target="_blank">[${n}]</a>` : `[${n}]`}</sup>`; }).join("");
  const actorFor = p => [...S.actors.keys()].find(a => personBrief(a) === p);
  const decisions = (b.meeting_goals || []).map(g => `<li><input type="checkbox"><span>${esc(g.text)}${cite(g.evidence)}</span></li>`).join("");
  const people = b.people.map(p => { const a = actorFor(p);
    return `<div><div class="who"><span class="av">${initials(p.name)}</span><b>${esc(p.name)}</b>${a ? `<button class="secondary" onclick="show('context');setTimeout(()=>select(G.byId.get('hub:${a}')),50)">Show in graph</button>` : ""}</div>
      ${BUCKETS.map(([k, label]) => (p[k] || []).length ? `<div class="bucket"><div class="label">${label}</div><ul>${p[k].map(i => `<li>${esc(i.text)}${cite(i.evidence)}</li>`).join("")}</ul></div>` : "").join("") || `<p class="label">Nothing reported.</p>`}</div>`; }).join("");
  const list = (title, arr, f) => arr && arr.length ? `<div class="blk"><h2>${title}</h2><ul>${arr.map(f).join("")}</ul></div>` : "";
  const more = list("Commitments", b.commitments, c => `<li><span class="status-t ${esc(c.status)}">${esc((c.status || "").replace("_", " "))}</span> ${c.owner ? `<b>${esc(c.owner)}</b> · ` : ""}${esc(c.what)}${cite(c.evidence)}</li>`)
    + list("Gaps", b.gaps, g => `<li>${esc(g.description)}${cite(g.evidence)}</li>`)
    + list("Action items", b.action_items, a => `<li>${esc(a.what)}${a.owner ? ` — <b>${esc(a.owner)}</b>` : ""}${cite(a.evidence)}</li>`)
    + list("Dependencies and conflicts", b.dependencies_and_conflicts, d => `<li>${esc(d.description)}${cite(d.evidence)}</li>`);
  const workers = [...S.actors.keys()].filter(a => a !== "master").length, when = new Date(run.started*1000).toLocaleString([], {weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit"});
  const body = `<div class="doc"><div class="kicker">Pre-meeting brief</div><h1>${esc(run.opts?.meeting || "Team sync")}</h1>
    <div class="byline">${when} · ${workers} laptops · last ${esc(run.opts?.since || "14d")}</div>
    <p class="lead">${esc(b.team_goal || b.headline || "")}</p>
    ${decisions ? `<h2>Decide in this meeting</h2><ol class="decisions">${decisions}</ol>` : ""}
    <h2>By person</h2><div class="cols">${people}</div>
    __SOURCES__
    ${more ? `<details class="more"><summary>Full brief: commitments, gaps, actions</summary>${more}</details>` : ""}</div>`;
  const sources = refs.length ? `<h2>Sources</h2><ol class="sources">${refs.map((id, i) => { const m = idx[id] || {};
    return `<li><span class="n">${i + 1}</span>${m.url ? `<a href="${esc(m.url)}" target="_blank">${esc(m.title || id)}</a>` : esc(m.title || id)}</li>`; }).join("")}</ol>` : "";
  $("#brief").innerHTML = body.replace("__SOURCES__", sources);
  document.querySelectorAll(".decisions input").forEach(i => i.onchange = () => i.parentElement.classList.toggle("checked", i.checked));
}

function tip(ev, html){ const t = $("#tip"); t.innerHTML = html; t.style.display = "block"; t.style.left = ev.clientX + 14 + "px"; t.style.top = ev.clientY + 14 + "px"; }
document.addEventListener("mouseover", ev => { const c = ev.target.closest("[data-tip]"); if (c) tip(ev, esc(c.dataset.tip)); });
document.addEventListener("mouseout", ev => { if (ev.target.closest("[data-tip]")) $("#tip").style.display = "none"; });

/* ======================= tasks ======================= */
const COLS = [["todo","To do"],["in_progress","In progress"],["blocked","Blocked"],["done","Done"]];
let TASKS = [], who = "all", TMETA = null;
async function loadTasks(){ const j = await (await fetch("/api/tasks")).json(); TASKS = j.tasks; TMETA = j; renderTasks(); }
function renderTasks(){
  const key = t => t.owner ? name(t.owner).toLowerCase() : "unassigned";
  const owners = [...new Set(TASKS.map(key))], list = TASKS.filter(t => who === "all" || key(t) === who);
  $("#tasks").innerHTML = `<div class="doc" style="max-width:1360px">
    <div class="tasks-head"><h1>Tasks</h1><div class="seg">${["all", ...owners].map(o => `<button class="${o === who ? "on" : ""}" data-o="${esc(o)}">${esc(o === "all" ? "Everyone" : o === "unassigned" ? "Unassigned" : o.replace(/^./, c => c.toUpperCase()))}</button>`).join("")}</div></div>
    ${TASKS.length ? "" : `<div class="note">No tasks yet. They appear after the After stage processes a meeting.</div>`}
    <div class="board">${COLS.map(([k, label]) => { const col = list.filter(t => (t.status || "todo") === k);
      return `<div class="col" data-s="${k}"><h3>${label}<span class="num">${col.length}</span></h3>${col.map(card).join("")}</div>`; }).join("")}</div></div>`;
  document.querySelectorAll(".seg button").forEach(b => b.onclick = () => { who = b.dataset.o; renderTasks(); });
  document.querySelectorAll(".task[draggable=true]").forEach(c => c.ondragstart = ev => ev.dataTransfer.setData("text", c.dataset.id));
  document.querySelectorAll(".col").forEach(col => {
    col.ondragover = ev => { ev.preventDefault(); col.classList.add("over"); }; col.ondragleave = () => col.classList.remove("over");
    col.ondrop = async ev => { ev.preventDefault(); col.classList.remove("over"); const id = ev.dataTransfer.getData("text"), t = TASKS.find(x => String(x.id) === id); if (!t) return;
      t.status = col.dataset.s; renderTasks(); await fetch(`/api/tasks/${id}`, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({status:t.status})}); };
  });
}

function card(t){
  const warn = (t.flags || []).filter(f => f && f !== "unassigned" && !["high","medium","low"].includes(f)).map(f => ({no_due_date:"No due date", unassigned:"Unassigned"})[f] || f.replace(/_/g, " "));
  return `<div class="task ${t.origin === "after" ? "" : "ro"}" draggable="${t.origin === "after"}" data-id="${esc(t.id)}" title="${esc(t.quote || "")}">
    <div class="t">${esc(t.title)}</div>
    <div class="meta">${t.owner ? `<span class="av">${initials(name(t.owner))}</span>${esc(name(t.owner))}` : `<span class="warn">Unassigned</span>`}
      ${t.due ? `<span>Due ${esc(t.due)}</span>` : ""}${warn.map(w => `<span class="warn">${esc(w)}</span>`).join("")}
      ${t.url ? `<a href="${esc(t.url)}" target="_blank" style="color:var(--accent);text-decoration:none">Issue ↗</a>` : ""}
      <span class="src">${t.origin === "after" ? (t.channel === "github" ? "GitHub" : "Slack") : "Brief"}</span></div></div>`;
}

/* ======================= boot ======================= */
(async () => {
  await document.fonts.ready; await loadIcons(); initGraph();
  CFG = await (await fetch("/api/config")).json();
  if (CFG.demo) $("#demo").style.display = "inline-block";
  if (["#brief", "#tasks"].includes(location.hash)) setTimeout(() => show(location.hash.slice(1)), 800);
  const r = await fetch("/api/runs/latest");
  if (r.ok){ const run = await r.json(); G.live = run.status === "running"; attach(run.id); } else syncGraph();
  setInterval(() => { if (RUN?.status === "running") setStatus("running", stageLabel()); }, 1000);
  // Pick up runs started elsewhere (Slack @agent, another browser) and animate them live.
  setInterval(async () => {
    const x = await fetch("/api/runs/latest?after=999999"); if (!x.ok) return;
    const run = await x.json();
    if (run.id !== RUN?.id && run.status === "running"){ resetAll(); G.live = true; attach(run.id); show("context"); }
  }, 2500);
})();

</script>
